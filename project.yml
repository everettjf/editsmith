name: EditSmith
options:
  bundleIdPrefix: com.everettjf
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  EditSmithCore:
    path: Core
  CodeEditor:
    url: https://github.com/ZeeZide/CodeEditor.git
    from: 1.2.6
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    DEVELOPMENT_TEAM: YPV49M8592
targets:
  EditSmith:
    type: application
    platform: macOS
    sources:
      - path: EditSmithSwift
      - path: EditSmith/Assets.xcassets
        buildPhase: resources
      - path: EditSmith/Localizable.xcstrings
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: EditSmithCore
      - package: CodeEditor
      - target: EditSmithExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnu.editsmith
        INFOPLIST_FILE: EditSmith/Info.plist
        CODE_SIGN_ENTITLEMENTS: EditSmith/EditSmith.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        PROVISIONING_PROFILE_SPECIFIER: ""
        REGISTER_APP_GROUPS: true
        ENABLE_HARDENED_RUNTIME: true
  EditSmithExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: EditSmithExtensionSwift
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: EditSmithCore
      - framework: "$(DEVELOPER_DIR)/Library/Frameworks/XcodeKit.framework"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnu.editsmith.extension
        PRODUCT_NAME: EditSmith
        PRODUCT_MODULE_NAME: EditSmithExtension
        INFOPLIST_FILE: EditSmithExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: EditSmithExtension/EditSmithExtension.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        REGISTER_APP_GROUPS: true
        APPLICATION_EXTENSION_API_ONLY: true
  EditSmithCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [EditSmithCoreTests]
    dependencies:
      - package: EditSmithCore
  EditSmithAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [EditSmithAppTests]
    dependencies:
      - target: EditSmith
      - package: EditSmithCore
schemes:
  EditSmith:
    build:
      targets:
        EditSmith: all
        EditSmithCoreTests: [test]
        EditSmithAppTests: [test]
    test:
      targets: [EditSmithCoreTests, EditSmithAppTests]
